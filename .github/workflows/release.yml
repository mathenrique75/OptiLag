name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pillow pystray psutil matplotlib fastapi uvicorn pydantic pyotp pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
        shell: pwsh

      - name: Show tree
        run: |
          Get-ChildItem -Recurse -Depth 2 | Select-Object FullName
          python -c "import customtkinter; print('ctk ok')"
        shell: pwsh

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name OptiLag `
            --collect-all customtkinter `
            --hidden-import PIL `
            --hidden-import pyotp `
            --hidden-import optilag_backend `
            --paths . `
            optilag_pubg.py
          if (-not (Test-Path "dist\OptiLag\OptiLag.exe") -and -not (Test-Path "dist\OptiLag.exe")) {
            Write-Error "OptiLag.exe nao foi gerado"
            exit 1
          }

      - name: Pack zip
        shell: pwsh
        run: |
          if (Test-Path "dist\OptiLag") {
            Compress-Archive -Path "dist\OptiLag\*" -DestinationPath OptiLag-windows.zip -Force
          } else {
            Compress-Archive -Path "dist\OptiLag.exe" -DestinationPath OptiLag-windows.zip -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: OptiLag-windows
          path: OptiLag-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: OptiLag-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
