name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyotp
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          if (Test-Path OptiLag.spec) {
            python -m PyInstaller OptiLag.spec --noconfirm
          } else {
            python -m PyInstaller --noconfirm --windowed --name OptiLag --collect-all customtkinter --paths . optilag_pubg.py
          }
      - name: Pack zip
        shell: pwsh
        run: Compress-Archive -Path dist\OptiLag\* -DestinationPath OptiLag-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OptiLag-windows
          path: OptiLag-windows.zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: OptiLag-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
